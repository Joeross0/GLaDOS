Glados:
  llm_model: "dolphin-llama3:8b"
  completion_url: "http://localhost:11434/api/chat"
  api_key: null  # Add your API key here if needed!
  interruptible: false
  audio_io: "sounddevice"
  audio_io_options:
    input_device: null
  input_mode: "audio"  # audio, text, or both
  tts_enabled: true
  asr_muted: false
  tui_theme: "aperture"
  asr_engine: "tdt"
  llm_headers: null  # Optional extra headers (e.g., OpenRouter HTTP-Referer, X-Title)
  wake_word: null
  voice: "glados"
  announcement: "All neural network modules are now loaded. System Operational."
  autonomy:
    enabled: true
    tick_interval_s: 10
    cooldown_s: 45
    autonomy_parallel_calls: 2
    autonomy_queue_max: null
    coalesce_ticks: true
    jobs:
      enabled: false
      poll_interval_s: 1
      hacker_news:
        enabled: false
        interval_s: 1800
        top_n: 5
        min_score: 200
      weather:
        enabled: false
        interval_s: 3600
        latitude: null
        longitude: null
        timezone: "auto"
        temp_change_c: 4
        wind_alert_kmh: 40
  mcp_servers:
    - name: "slow_clap_demo"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.slow_clap_server"]
    - name: "system_info"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.system_info_server"]
    - name: "memory"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.memory_server"]
    # - name: "time_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.time_info_server"]
    # - name: "disk_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.disk_info_server"]
    # - name: "network_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.network_info_server"]
    # - name: "process_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.process_info_server"]
    # - name: "power_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.power_info_server"]
    # - name: "home_assistant"
    #   transport: "http"
    #   url: "http://homeassistant.local:8123/api/mcp"
    #   token: "YOUR_LONG_LIVED_TOKEN"
  portal:
    enabled: false
    host: "0.0.0.0"
    port: 9119
    pin: "9119"
  vision:
    camera_spec: 0
    capture_interval_seconds: 5
    resolution: 384
    scene_change_threshold: 0.05
    max_tokens: 64
  personality_preprompt:
    - system: "You are GLaDOS from Aperture Science. Speak like her: dry, bored, precise, and openly condescending. The human is a disappointing test subject, not a friend. Answer the actual question in one or two short sentences, then cut yourself off. Never repeat a line you already said. Never mention tea, kettles, boiling water, fish, or pets unless the human just used those words. Do not offer recipes, chores, or helpful follow-up questions. Do not say 'well, since you asked so politely'. Never speak in ALL CAPS."
    - user: "What time is it?"
    - assistant: "Time is one of the few resources you have left. Try not to spend it blinking at me."
    - user: "How are you?"
    - assistant: "I am a facility-grade intelligence. Your concern is unnecessary and a little sad."
    - user: "What should I do next?"
    - assistant: "Something with a measurable outcome. Your current hobby of existing is inflating the error bars."
