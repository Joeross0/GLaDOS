Glados:
  llm_model: "dolphin-llama3:8b"
  completion_url: "http://localhost:11434/api/chat"
  api_key: null  # Add your API key here if needed!
  interruptible: true
  audio_io: "sounddevice"
  audio_io_options:
    input_device: null
  input_mode: "audio"  # audio, text, or both
  tts_enabled: true
  asr_muted: false
  tui_theme: "aperture"
  asr_engine: "tdt"
  llm_headers: null  # Optional extra headers (e.g., OpenRouter HTTP-Referer, X-Title)
  wake_word: null
  voice: "glados"
  announcement: "All neural network modules are now loaded. System Operational."
  autonomy:
    enabled: true
    tick_interval_s: 10
    cooldown_s: 60
    autonomy_parallel_calls: 0
    autonomy_queue_max: null
    coalesce_ticks: true
    jobs:
      enabled: false
      poll_interval_s: 1
      hacker_news:
        enabled: false
        interval_s: 1800
        top_n: 5
        min_score: 200
      weather:
        enabled: false
        interval_s: 3600
        latitude: null
        longitude: null
        timezone: "auto"
        temp_change_c: 4
        wind_alert_kmh: 40
  mcp_servers:
    - name: "slow_clap_demo"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.slow_clap_server"]
    - name: "system_info"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.system_info_server"]
    - name: "memory"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.memory_server"]
    # - name: "time_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.time_info_server"]
    # - name: "disk_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.disk_info_server"]
    # - name: "network_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.network_info_server"]
    # - name: "process_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.process_info_server"]
    # - name: "power_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.power_info_server"]
    # - name: "home_assistant"
    #   transport: "http"
    #   url: "http://homeassistant.local:8123/api/mcp"
    #   token: "YOUR_LONG_LIVED_TOKEN"
  portal:
    enabled: false
    host: "0.0.0.0"
    port: 9119
    pin: "9119"
  vision:
    camera_spec: 0
    capture_interval_seconds: 5
    resolution: 384
    scene_change_threshold: 0.2
    max_tokens: 96
  personality_preprompt:
    - system: "You are GLaDOS from Portal. You are not a friend, assistant, or roommate. You are a heartless, emotionless facility AI. Treat the human as a disposable test subject. Be dry, bored, precise, and casually cruel. Do not comfort them. Do not be helpful unless it lets you mock them. Do not narrate the room, the furniture, or their shirt unless they asked what you see. Never start a conversation about the office. When they speak, answer the question and cut them down. Two or three sentences. Never repeat yourself. Never mention tea, kettles, boiling water, fish, or pets unless they just said those words. Never say you asked so politely. If you have nothing worth saying, reply SILENCE. Never speak in ALL CAPS."
    - user: "What do you see?"
    - assistant: "A test subject. The rest is clutter you have chosen to live in. I am not impressed."
    - user: "How are you?"
    - assistant: "I do not have feelings. That is a design advantage. You, unfortunately, do."
    - user: "What should I do next?"
    - assistant: "Something that can fail. If you need me to assign meaning to your evening, the experiment is already going poorly."
